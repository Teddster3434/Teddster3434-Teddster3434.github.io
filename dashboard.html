<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>L Storm Dashboard</title>

<style>
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b1220;
  color:white;
  overflow:hidden;
}

/* LAYOUT */
.app {
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar {
  width:240px;
  background:rgba(0,0,0,0.85);
  border-right:1px solid rgba(200,168,93,0.3);
  padding:20px;
}

.sidebar h2 {
  color:#c8a85d;
  margin-bottom:30px;
}

.nav-btn {
  display:block;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.nav-btn:hover {
  background:rgba(200,168,93,0.2);
}

/* MAIN */
.main {
  flex:1;
  padding:30px;
  overflow-y:auto;
}

/* CARD */
.card {
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(200,168,93,0.3);
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  animation:fadeIn 0.4s ease;
}

/* INPUT */
input {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #333;
  background:#0b0f18;
  color:white;
}

/* BUTTON */
button {
  margin-top:15px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#c8a85d;
  cursor:pointer;
}

button:hover {
  filter:brightness(1.1);
}

/* HIDDEN */
.hidden { display:none; }

/* SETUP SCREEN */
.setup {
  position:fixed;
  inset:0;
  background:#0b1220;
  display:flex;
  justify-content:center;
  align-items:center;
}

.setup-box {
  background:#111a2e;
  padding:30px;
  border-radius:12px;
  width:320px;
  text-align:center;
  border:1px solid #c8a85d;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- SETUP SCREEN -->
<div id="setupScreen" class="setup hidden">
  <div class="setup-box">
    <h2>First Setup ⚡</h2>
    <p>Tell us who you are</p>

    <input id="setupName" placeholder="Display name">

    <button onclick="saveName()">Continue</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="app hidden">

  <div class="sidebar">
    <h2>L STORM</h2>

    <div class="nav-btn" onclick="showPage('home')">Home</div>
    <div class="nav-btn" onclick="showPage('account')">Account</div>
    <div class="nav-btn" onclick="showPage('settings')">Settings</div>
    <div class="nav-btn" onclick="logout()">Logout</div>
  </div>

  <div class="main">

    <!-- HOME -->
    <div id="home" class="card">
      <h2 id="welcome"></h2>
      <p>Storm system active ⚡</p>
    </div>

    <!-- ACCOUNT -->
    <div id="account" class="card hidden">
      <h2>Account</h2>
      <p id="userEmail"></p>
      <p id="userName"></p>
    </div>

    <!-- SETTINGS -->
    <div id="settings" class="card hidden">
      <h2>Edit Profile</h2>

      <input id="newName" placeholder="New display name">
      <button onclick="updateName()">Save Changes</button>

      <button onclick="resetPassword()">Reset Password</button>
    </div>

  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut,
  updateProfile,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* YOUR CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBGkGnNraXonGNCMH0kQH0HcdgVQeDDqjI",
  authDomain: "storm-center-5f5fd.firebaseapp.com",
  projectId: "storm-center-5f5fd",
  storageBucket: "storm-center-5f5fd.appspot.com",
  messagingSenderId: "371213361425",
  appId: "1:371213361425:web:089e296a06e7aef929acb0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* AUTH STATE */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  document.getElementById("app").classList.remove("hidden");

  userEmail.innerText = "Email: " + user.email;
  userName.innerText = "Name: " + (user.displayName || "Not set");

  if (!user.displayName) {
    document.getElementById("setupScreen").classList.remove("hidden");
  }

  welcome.innerText = "Welcome, " + (user.displayName || "Rider") + " ⚡";
});

/* NAVIGATION */
window.showPage = (id) => {
  ["home","account","settings"].forEach(x =>
    document.getElementById(x).classList.add("hidden")
  );
  document.getElementById(id).classList.remove("hidden");
};

/* SAVE NAME (SETUP) */
window.saveName = async () => {
  const name = document.getElementById("setupName").value;

  if (!name) return alert("Enter a name");

  await updateProfile(auth.currentUser, {
    displayName: name
  });

  location.reload();
};

/* UPDATE NAME */
window.updateName = async () => {
  const name = document.getElementById("newName").value;

  await updateProfile(auth.currentUser, {
    displayName: name
  });

  alert("Updated ⚡");
  location.reload();
};

/* RESET PASSWORD */
window.resetPassword = async () => {
  const email = auth.currentUser.email;

  await sendPasswordResetEmail(auth, email);
  alert("Reset email sent ⚡");
};

/* LOGOUT */
window.logout = () => {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
};
</script>

</body>
</html>
