<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L Storm</title>

<style>
:root {
  --gold: #c8a85d;
}

/* 🌑 BASE */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;
}

/* 🌩️ BACKGROUND */
.bg {
  position: fixed;
  inset: 0;
  background: url("Hat.png") center/cover no-repeat;
  filter: brightness(0.35);
  z-index: -2;
}

.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, transparent, #000 90%);
  z-index: -1;
}

/* 🔝 NAV */
.nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 14px;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(8px);
  z-index: 100;
}

.nav a {
  color: white;
  text-decoration: none;
  padding: 10px 16px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  font-size: 14px;
}

.nav a:hover {
  border-color: var(--gold);
}

/* 🎩 LOGIN ICON */
.login-btn {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
}

.login-btn img {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 4px;
  background: rgba(0,0,0,0.3);
}

/* 🎯 MAIN CONTENT */
#mainContent {
  display: none;
  height: 100vh;
  justify-content: center;
  align-items: center;
  text-align: center;
}

h1 {
  font-size: 64px;
  letter-spacing: 6px;
}

.tagline {
  color: var(--gold);
  margin-top: 10px;
}

/* 🎬 WARNING OVERLAY */
#warning {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
  background: radial-gradient(circle, rgba(0,0,0,0.5), #000);
  backdrop-filter: blur(6px);
}

/* ⚡ WARNING BOX */
.warning-box {
  background: rgba(10,10,10,0.9);
  border-radius: 16px;
  padding: 40px 30px;
  text-align: center;
  max-width: 420px;
  width: 90%;
  border: 1px solid rgba(200,168,93,0.4);

  box-shadow:
    0 0 30px rgba(200,168,93,0.3),
    inset 0 0 20px rgba(200,168,93,0.1);

  animation: fadeIn 0.8s ease;
}

/* 🤠 TITLE */
#warningTitle {
  font-size: 28px;
  color: var(--gold);
  margin-bottom: 10px;
  animation: glow 2s infinite alternate;
}

/* TEXT */
.warn-text {
  opacity: 0.85;
  margin-bottom: 20px;
}

/* 🔥 BUTTON */
.enter-btn {
  background: linear-gradient(135deg, #c8a85d, #a88a45);
  border: none;
  padding: 12px 28px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 0 12px rgba(200,168,93,0.5);
}

.enter-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 0 25px rgba(200,168,93,0.8);
}

/* SMALL TEXT */
.sub-note {
  margin-top: 12px;
  font-size: 12px;
  opacity: 0.5;
}

/* ✨ ANIMATIONS */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes glow {
  from { text-shadow: 0 0 5px rgba(200,168,93,0.2); }
  to { text-shadow: 0 0 20px rgba(200,168,93,0.9); }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<!-- NAV -->
<div class="nav">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="story.html">Story</a>
  <a href="links.html">Links</a>
  <a href="help.html">Help</a>

  <a href="login.html" class="login-btn">
    <img src="login.png">
  </a>
</div>

<!-- 🎯 MAIN -->
<div id="mainContent">
  <div>
    <h1>L STORM</h1>
    <div class="tagline">Not lost. Becoming.</div>
  </div>
</div>

<!-- 🎬 WARNING -->
<div id="warning">
  <div class="warning-box">

    <h2 id="warningTitle"></h2>

    <div class="warn-text">
      This site contains strong themes.<br>
      Listener discretion advised.
    </div>

    <button class="enter-btn" id="continueBtn">
      YEE HAW →
    </button>

    <div class="sub-note">
      (you can always turn back later…)
    </div>

  </div>
</div>

<script>
const warning = document.getElementById("warning");
const main = document.getElementById("mainContent");
const btn = document.getElementById("continueBtn");

/* 🎭 RANDOM TITLE */
const titles = [
  "Easy now, cowboy ⚡",
  "Storm ahead ⚡",
  "Hold up, partner",
  "Before you step in…",
  "The wind’s picking up…"
];

document.getElementById("warningTitle").textContent =
  titles[Math.floor(Math.random() * titles.length)];

/* 🎬 TRANSITION */
function showMain(){
  warning.style.opacity = "0";

  setTimeout(() => {
    warning.style.display = "none";
    main.style.display = "flex";
    document.body.style.overflow = "auto";
  }, 400);
}

function showWarning(){
  warning.style.display = "flex";
  main.style.display = "none";
}

/* CLICK */
btn.addEventListener("click", () => {
  localStorage.setItem("accepted", "yes");
  showMain();
});

/* LOAD */
window.onload = () => {
  if(localStorage.getItem("accepted") === "yes"){
    main.style.display = "flex";
    document.body.style.overflow = "auto";
  } else {
    showWarning();
  }
};
</script>

</body>
</html>
