<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L Storm</title>

<style>
:root {
  --gold: #c8a85d;
  --bg: #0c0f14;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  background: var(--bg);
}

/* 🌩️ BACKGROUND */
.bg {
  position: fixed;
  inset: 0;
  background: url("Hat.png") center/cover no-repeat;
  filter: brightness(0.35);
  z-index: -2;
}

.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, transparent, #0c0f14 85%);
  z-index: -1;
}

/* 🔝 NAVBAR */
.nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 14px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
  z-index: 100;
}

.nav a {
  color: white;
  text-decoration: none;
  padding: 10px 16px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  font-size: 14px;
}

.nav a:hover {
  border-color: var(--gold);
}

/* 🎩 LOGIN ICON (NOT TEXT) */
.login-btn {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
}

.login-btn img {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 4px;
  background: rgba(0,0,0,0.3);
}

/* 🎯 HERO */
.center {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  pointer-events: none;
  text-align: center;
}

h1 {
  font-size: 64px;
  letter-spacing: 6px;
}

.tagline {
  margin-top: 10px;
  color: var(--gold);
}

/* ⚠️ WARNING SCREEN */
#warning {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  z-index: 90;
}

.btn {
  margin-top: 20px;
  padding: 12px 24px;
  background: var(--gold);
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* 🎩 FLOATING LOGO */
#hatLogo {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 80px;
  opacity: 0.8;
  filter: drop-shadow(0 0 12px rgba(200,168,93,0.3));
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<!-- NAV -->
<div class="nav">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="story.html">Story</a>
  <a href="links.html">Links</a>
  <a href="help.html">Help</a>

  <!-- LOGIN ICON -->
  <a href="login.html" class="login-btn">
    <img src="login.png">
  </a>
</div>

<!-- HERO -->
<div class="center">
  <h1>L STORM</h1>
  <div class="tagline">Not lost. Becoming.</div>
</div>

<!-- WARNING -->
<div id="warning">
  <h2 id="warningTitle"></h2>
  <p>This site contains strong themes. Listener discretion advised.</p>
  <button class="btn" id="continueBtn">Continue</button>
</div>

<img src="Hat.png" id="hatLogo">

<script>
/* 🎭 RANDOM WARNING TITLES */
const titles = [
  "Easy now, cowboy 🤠",
  "Storm ahead ⚡",
  "Hold up a second, partner",
  "Before you step in…",
  "The wind’s picking up…",
  "Not so fast, cowboy"
];

document.getElementById("warningTitle").textContent =
  titles[Math.floor(Math.random() * titles.length)];

/* ⚠️ WARNING LOGIC */
const warning = document.getElementById("warning");
const btn = document.getElementById("continueBtn");

function showMain(){
  warning.style.display = "none";
}

function showWarning(){
  warning.style.display = "flex";
}

btn.addEventListener("click", () => {
  localStorage.setItem("accepted", "yes");
  showMain();
});

window.onload = () => {
  if(localStorage.getItem("accepted") === "yes"){
    showMain();
  } else {
    showWarning();
  }
};
</script>

</body>
</html>
