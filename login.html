<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L Storm - Login</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url("Hat.png") no-repeat center center fixed;
  background-size: cover;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* dark overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
}

/* card */
.container {
  position: relative;
  z-index: 2;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  border-radius: 15px;
  padding: 40px;
  width: 320px;
  text-align: center;
  box-shadow: 0 0 40px rgba(0,0,0,0.7);
  animation: fadeIn 1s ease;
}

h1 {
  margin-bottom: 10px;
  letter-spacing: 3px;
}

.subtitle {
  color: #c8a85d;
  margin-bottom: 25px;
}

/* inputs */
input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #0b0f18;
  color: white;
  transition: 0.3s;
}

input:focus {
  border-color: #c8a85d;
  box-shadow: 0 0 8px #c8a85d;
}

/* button */
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #c8a85d;
  color: black;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px #c8a85d;
}

/* links */
.links {
  margin-top: 15px;
  font-size: 14px;
}

.links span {
  color: #c8a85d;
  cursor: pointer;
}

.links span:hover {
  text-decoration: underline;
}

.status {
  margin-top: 10px;
  font-size: 13px;
  color: #ff6b6b;
}

/* animation */
@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">
  <h1>LOGIN</h1>
  <div class="subtitle">Storm’s coming… stay steady.</div>

  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Ride In ⚡</button>
  </form>

  <div class="links">
    <div><span id="signup">Create account</span></div>
    <div><span id="reset">Forgot password?</span></div>
  </div>

  <div class="status" id="status"></div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* YOUR CONFIG (FIXED STORAGE BUCKET) */
const firebaseConfig = {
  apiKey: "AIzaSyBGkGnNraXonGNCMH0kQH0HcdgVQeDDqjI",
  authDomain: "storm-center-5f5fd.firebaseapp.com",
  projectId: "storm-center-5f5fd",
  storageBucket: "storm-center-5f5fd.appspot.com",
  messagingSenderId: "371213361425",
  appId: "1:371213361425:web:089e296a06e7aef929acb0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("loginForm");
const status = document.getElementById("status");

/* LOGIN (FIXES REFRESH ISSUE) */
form.addEventListener("submit", (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  status.textContent = "Signing in...";

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      status.style.color = "#00ffae";
      status.textContent = "Welcome back ⚡";
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);
    })
    .catch(err => {
      status.style.color = "#ff6b6b";
      status.textContent = err.message;
    });
});

/* SIGN UP */
document.getElementById("signup").onclick = () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!email || !password) {
    status.textContent = "Enter email + password first";
    return;
  }

  createUserWithEmailAndPassword(auth, email, password)
    .then(() => {
      status.style.color = "#00ffae";
      status.textContent = "Account created ⚡";
    })
    .catch(err => {
      status.textContent = err.message;
    });
};

/* RESET PASSWORD */
document.getElementById("reset").onclick = () => {
  const email = document.getElementById("email").value;

  if (!email) {
    status.textContent = "Enter your email first";
    return;
  }

  sendPasswordResetEmail(auth, email)
    .then(() => {
      status.style.color = "#00ffae";
      status.textContent = "Reset email sent ⚡";
    })
    .catch(err => {
      status.textContent = err.message;
    });
};
</script>

</body>
</html>
