<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - L Storm</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  background: url("Hat.png") no-repeat center center fixed;
  background-size: cover;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(12,15,20,0.75);
  z-index: 0;
}

/* Scene wrapper for animation */
#scene {
  transition: transform 1.2s ease, filter 1.2s ease;
}

/* Zoom effect */
.zooming {
  transform: scale(1.25);
  filter: blur(2px);
}

/* Login card */
.container {
  position: relative;
  z-index: 10;
  background: rgba(0,0,0,0.4);
  padding: 40px 30px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  text-align: center;
  width: 90%;
  max-width: 400px;
  backdrop-filter: blur(8px);
}

h1 {
  margin-bottom: 10px;
}

.dynamic-message {
  margin-bottom: 20px;
  color: #c8a85d;
  font-size: 16px;
  min-height: 40px;
}

/* Inputs */
input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #444;
  background: #0b0f18 !important;
  color: white !important;
  margin-bottom: 15px;
  outline: none;
}

input:-webkit-autofill {
  -webkit-box-shadow: 0 0 0px 1000px #0b0f18 inset !important;
  -webkit-text-fill-color: white !important;
}

input:focus {
  border-color: #c8a85d;
  box-shadow: 0 0 10px rgba(200,168,93,0.4);
}

/* Button */
.btn {
  width: 100%;
  padding: 12px;
  background: #c8a85d;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  transition: 0.2s ease;
}

.btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

.status {
  margin-top: 15px;
  font-size: 14px;
  min-height: 20px;
}

/* Hat animation */
#hat {
  position: fixed;
  bottom: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  opacity: 0;
  transition: all 1.2s ease;
  z-index: 20;
}

.hat-rise {
  bottom: 40%;
  opacity: 1;
}
</style>
</head>

<body>

<div id="scene">
  <div class="container">
    <h1>Login</h1>
    <div class="dynamic-message" id="message"></div>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" class="btn">Login</button>
    </form>

    <div class="status" id="status"></div>
  </div>
</div>

<img id="hat" src="Hat.png">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>

<script>
// 🔥 RANDOM MESSAGES
const messages = [
  "Hat secured. Ball missing. Let’s fix that.",
  "The storm’s rolling in — take control.",
  "We lost the trail… let’s get you back.",
  "Hold steady. You're nearly there."
];

document.getElementById("message").textContent =
  messages[Math.floor(Math.random() * messages.length)];

// 🔥 FIREBASE CONFIG (PUT YOURS HERE)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// 🔐 LOGIN
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const status = document.getElementById("status");

  status.innerText = "Signing in...";

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {

      status.innerText = "Welcome back.";

      // 🎬 ANIMATION
      document.getElementById("scene").classList.add("zooming");
      document.getElementById("hat").classList.add("hat-rise");

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1600);

    })
    .catch((error) => {
      status.innerText = error.message;
    });
});
</script>

</body>
</html>
