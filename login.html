<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - L Storm</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: url("Hat.png") no-repeat center center fixed;
    background-size: cover;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(12, 15, 20, 0.75);
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    padding: 40px 30px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    text-align: center;
    width: 90%;
    max-width: 400px;
    backdrop-filter: blur(8px);
  }

  h1 {
    margin-bottom: 10px;
  }

  .dynamic-message {
    margin-bottom: 20px;
    color: #c8a85d;
    font-size: 16px;
    min-height: 40px;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #0b0f18 !important;
    color: white !important;
    margin-bottom: 15px;
    outline: none;
  }

  /* 🔥 Fix autofill */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0px 1000px #0b0f18 inset !important;
    -webkit-text-fill-color: white !important;
    transition: background-color 9999s ease-in-out 0s;
  }

  input:focus {
    border-color: #c8a85d;
    box-shadow: 0 0 10px rgba(200,168,93,0.4);
  }

  .btn {
    width: 100%;
    padding: 12px;
    background: #c8a85d;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.2s ease;
  }

  .btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }

  .forgot {
    margin-top: 15px;
  }

  .forgot a {
    color: #c8a85d;
    text-decoration: none;
    font-size: 14px;
  }

  .forgot a:hover {
    text-decoration: underline;
  }

  .status {
    margin-top: 15px;
    font-size: 14px;
    min-height: 20px;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Login</h1>
  <div class="dynamic-message" id="message"></div>

  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required autocomplete="email">
    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
    <button type="submit" class="btn">Login</button>
  </form>

  <div class="forgot">
    <a href="passwordreset.html">Forgot your password?</a>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
/* 🎭 RANDOM MESSAGES */
const messages = [
  "We found the hat… but where’s the ball?",
  "Looks like we’re lost in a storm… let’s find the way back.",
  "The wind’s picking up — steady now.",
  "We lost the trail… let’s get you back on track.",
  "The storm’s rolling in — take control.",
  "Hat secured. Ball missing. Let’s fix that.",
  "Something’s drifted off… time to pull it back."
];

document.getElementById("message").textContent =
  messages[Math.floor(Math.random() * messages.length)];

/* 🔐 FORM HANDLING */
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const status = document.getElementById("status");
  status.innerText = "Signing in...";

  // 🚀 Placeholder for Firebase login
  setTimeout(() => {
    status.innerText = "Login system not connected yet.";
  }, 800);
});
</script>

</body>
</html>
